[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pic-tfln-mzm"
version = "0.1.0"
description = "Learning and reproducibility study of a thin-film lithium niobate modulator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbclient>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]
